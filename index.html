r(--ink);border-radius:21px;padding:22px;margin:10px 0 4px;transition:transform .15s}.code:hover{transform:translateY(-2px)}.code-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.code strong{font-size:24px}.code small{font-size:10px;color:var(--lime);font-weight:800}.code small.high{color:var(--red)}.group{margin:16px 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{margin:0;min-height:145px;padding:22px}.value{font-size:36px;font-weight:800;letter-spacing:-1.2px;margin-top:18px;white-space:nowrap}.value span{font-size:16px;letter-spacing:0}.fine{font-size:12px;color:var(--muted)}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:14px max(20px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#101415 14%)}.navinner{display:flex;max-width:600px;margin:auto;background:#101415;border-radius:18px;padding:5px;box-shadow:0 -12px 30px #101415}nav button{flex:1;background:none;color:var(--muted);padding:15px 5px;font-size:12px;border-radius:14px}nav button[aria-current=page]{background:var(--card);color:var(--lime);font-weight:800}.notice{font-size:13px}.split{display:flex;justify-content:space-between;gap:18px;align-items:center}.hist-date{font-size:11px;font-weight:800;color:var(--orange)}.empty{padding:36px 24px}.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);z-index:12;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:16px;max-width:90vw;box-shadow:0 6px 30px #0008;font-size:13px}.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:#252d2f;border:1px solid #3d484a;max-width:490px;max-height:85dvh;overflow:auto;border-radius:24px;padding:26px;box-shadow:0 20px 100px #0008}.dialog h2{margin-top:0}.dialog p{color:#d5ddda}.dialog .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}.actions button{border-radius:12px;background:#354239;padding:13px 16px;color:var(--lime);font-weight:700}.actions .confirm{background:var(--lime);color:var(--bg)}.links a{color:var(--lime);overflow-wrap:anywhere}.safety{margin-top:16px}.loading{animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.4}}@media(min-width:750px){.app{padding-top:10px}header{padding-bottom:12px}.demo{margin-bottom:38px}h1{font-size:49px}.intro{margin-bottom:30px}.widegrid{grid-template-columns:repeat(3,1fr)}.live-layout{max-width:850px}.safety{max-width:100%}}@media(max-width:749px){.app{max-width:520px;padding:0 20px 112px}header{padding-top:23px}.brand{font-size:27px}.demo{margin-bottom:31px}.layout{display:block}h1{font-size:34px}.card{padding:22px}.hero{padding:23px}.value{font-size:30px}.metric{padding:19px;min-height:132px}.num{font-size:70px}.intro p{font-size:14px}.grid{gap:12px}nav button{font-size:11px}.label{font-size:10px}}
</style></head><body><div class="app"><header><div class="brand">Car Diagnostic</div><div class="badge">● DEMO WEB</div></header><div class="demo">SIMULACIÓN · No son datos de tu coche</div><main id="main"></main></div><nav aria-label="Pantallas"><div class="navinner"><button data-tab="diagnostic">Diagnóstico</button><button data-tab="repairs">Reparaciones</button></div></nav><div id="modal"></div><div id="toast" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s),store='torquea-demo-history-v1';let tab='diagnostic',connected=false,scanned=false,cleared=false,busy=false,ticks=0,history=[],modalReturn=null;
try{const h=JSON.parse(localStorage.getItem(store)||'[]');if(Array.isArray(h))history=h.slice(0,200).filter(x=>x&&typeof x.date==='number'&&['scan','clear','live'].includes(x.kind));}catch{}
const catalog={P0171:['Demasiado aire en la mezcla','La centralita detecta mezcla pobre en el banco 1. Puede haber entrada de aire, falta de combustible o una medición incorrecta.','Revisar en taller'],P0301:['Fallo de combustión · cilindro 1','El cilindro 1 no quema correctamente. No confirma una bobina o bujía rota. Si el testigo parpadea o hay tirones fuertes, detente con seguridad y pide asistencia.','Prioridad alta'],P0420:['Eficiencia del catalizador baja','La centralita detecta eficiencia baja del sistema catalizador en el banco 1. Hay que comprobar sensores, fugas y combustión antes de sustituirlo.','Revisar en taller']};
const engine='<svg class="engine" viewBox="0 0 240 120" aria-label="Icono de motor" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><path d="M45 35h32V23h50v13h39l15 17h24v39h-24l-14 14H66L48 88H30V48h15z"/><path d="M89 11h30M16 56v28"/><path stroke="#ffb16b" d="m121 46-18 25h23l-18 24"/></g></svg>';
function intro(over,title,sub){return '<div class="intro"><div class="eyebrow">'+over+'</div><h1>'+title+'</h1><p>'+sub+'</p></div>'}
function button(label,action,secondary=false){return '<button class="'+(secondary?'secondary':'primary')+'" data-action="'+action+'">'+label+'</button>'}
function safe(){return '<section class="card notice safety"><h3>Consulta con el coche parado</h3><p>Testigo parpadeando, humo, sobrecalentamiento o tirones fuertes: detente con seguridad y pide ayuda. La app no confirma si es seguro circular.</p></section>'}
function group(name,codes){return '<section class="group"><div class="label">'+name.toUpperCase()+' · '+codes.length+'</div>'+codes.map(c=>'<button class="code" data-code="'+c+'"><div class="code-top"><strong>'+c+'</strong><small class="'+(c==='P0301'?'high':'')+'">'+(c==='P0301'?'ALTA':'VER ›')+'</small></div><h3>'+catalog[c][0]+'</h3></button>').join('')+'</section>'}
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
 const root=$('#main');
 if(tab==='diagnostic')root.innerHTML=intro('OBD2 · MOTOR Y EMISIONES','Entiende tu coche.','Lee los códigos. Guarda la lectura. Decide con información.')+'<div class="layout"><div><section class="card hero">'+(scanned?'<div class="label">ÚLTIMA LECTURA · DEMO</div><div class="num '+(cleared?'lime':'')+'">'+(cleared?'0':'2')+'</div><h2>códigos confirmados</h2><p>Testigo motor: '+(cleared?'apagado':'encendido')+'</p>'+(cleared?'<p class="fine">Sin códigos confirmados no significa que el coche esté libre de averías.</p>':''):'<div class="label">LISTO CUANDO TÚ LO ESTÉS</div>'+engine+'<h2>'+(connected?'Ya puedes leer el motor':'Prueba antes de conectar')+'</h2><p>ELM327 simulado · no necesitas adaptador</p>')+button(busy?'Leyendo simulador…':connected?'Buscar fallos':'Probar demo · sin adaptador',connected?'scan':'demo')+'</section>'+safe()+'<button class="quiet" data-action="about">Alcance y fuentes ›</button></div><div>'+(scanned?group('Confirmados',cleared?[]:['P0171','P0301'])+group('Pendientes',cleared?[]:['P0171'])+group('Permanentes',['P0420']):'<section class="card"><div class="eyebrow">UNA VUELTA RÁPIDA</div><h2>Un coche ficticio.<br>Una prueba de verdad.</h2><p>Conecta el simulador y busca fallos. Después explora sus cifras y el historial, abre las guías de Reparaciones.</p>'+button('Ver cómo se conecta','connection',true)+'</section>')+'</div></div>';
 if(tab==='live'){root.innerHTML=intro('CIFRAS SIMULADAS','El motor, en cifras.','Solo una demostración: estas cifras no se reciben de un vehículo.')+'<div class="live-layout">'+(!connected?'<section class="card"><h2>Activa el simulador</h2><p>Verás RPM, velocidad, refrigerante y tensión ficticios.</p>'+button('Conectar simulador','connect')+'</section>':'<div class="grid widegrid">'+[['rpm','RÉGIMEN'],['speed','VELOCIDAD'],['temp','REFRIGERANTE'],['volts','TENSIÓN¹'],['fuel','CONSUMO²'],['rate','CAUDAL²']].map(([k,l])=>'<section class="card metric"><div class="label">'+l+'</div><div class="value" id="'+k+'">-</div></section>').join('')+'</div><p class="fine" id="stamp"></p>'+button('Guardar estas cifras','saveLive',true))+'<p class="fine">- = dato no disponible. No todos los coches ofrecen todos los datos.</p><p class="fine">¹ Tensión orientativa, no prueba de salud de batería.<br>² Esta demo no ofrece caudal de combustible. La app no inventa el consumo si falta el dato.</p>' +'</div>';updateLive();}
 if(tab==='history'){root.innerHTML=intro('SOLO EN ESTE NAVEGADOR','Tu historial.','Hasta 200 lecturas ficticias · no se suben a la nube.')+'<div class="layout"><div>'+(history.length?history.map((h,i)=>'<button class="code" data-history="'+i+'"><div class="hist-date">DEMO · '+new Date(h.date).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+'</div><h2>'+({scan:'Diagnóstico',clear:'Borrado confirmado',live:'Datos en vivo'}[h.kind])+'</h2><p>'+((h.kind==='scan'||h.kind==='clear')?'Confirmados: '+(h.cleared?'sin códigos':'P0171, P0301'):'RPM '+Number(h.rpm||0)+' · '+Number(h.speed||0)+' km/h')+'</p></button>').join(''):'<section class="card empty"><h2>El primer paso es una lectura</h2><p>Los diagnósticos se guardan automáticamente. Las cifras, cuando tú quieras.</p>'+button('Ir al diagnóstico','diagnostic')+'</section>')+'</div><div><section class="card"><h3>Privado y ficticio</h3><p>Solo se guarda en este navegador. Borrar los datos del navegador también elimina este historial. No contiene datos de ningún coche real.</p></section>'+(history.length?'<button class="quiet" data-action="deleteHistory">Eliminar historial de demo ›</button>':'')+'</div></div>';}
 if(tab==='connection')root.innerHTML=intro('SIN ADAPTADOR. SIN CUENTAS.','Conecta y lee.','Esta web solo simula el flujo. No lee Bluetooth ni se conecta a tu coche.')+'<div class="layout"><section class="card"><div class="label">'+(connected?'SIMULADOR ACTIVO':'01 · PRUEBA LOCAL')+'</div><h2>'+(connected?'ELM327 simulado conectado':'Tu primer diagnóstico, sin coche')+'</h2><p>Prueba todas las pantallas con códigos ficticios. No hace falta instalar nada ni conceder permisos.</p>'+button(connected?'Desconectar simulador':'Conectar simulador',connected?'disconnect':'connect')+(connected?button('Ir al diagnóstico','diagnostic',true):'')+'</section><div><section class="card"><h3>La app Android, después</h3><p>Para un coche real hará falta un adaptador Bluetooth clásico (SPP) compatible y la app Android. Esta demo no comprueba compatibilidad física.</p></section><section class="card"><h3>Sin datos reales</h3><p>El historial de esta web es independiente del de la app Android. No hay cuentas, subidas ni sincronización.</p></section><button class="quiet" data-action="reset">Reiniciar demostración ›</button></div></div>';
}
let engineOff=false;function values(){return engineOff?{rpm:0,speed:0,temp:84,volts:12.6}:{rpm:820+Math.round(Math.sin(ticks/3)*16),speed:0,temp:84,volts:14.1};}
function updateLive(){if(tab!=='live'||!connected)return;const v=values();for(const[k,t]of Object.entries({rpm:v.rpm,speed:v.speed+' <span>km/h</span>',temp:v.temp+' <span>°C</span>',volts:v.volts.toLocaleString('es-ES')+' <span>V</span>',fuel:'-',rate:'-'})){const e=document.getElementById(k);if(e)e.innerHTML=t;}if($('#stamp'))$('#stamp').textContent='Simulado · '+new Date().toLocaleTimeString('es-ES');}
function save(kind){const v=values();history.unshift({kind,date:Date.now(),cleared,rpm:v.rpm,speed:v.speed,temp:v.temp,volts:v.volts});history=history.slice(0,200);try{localStorage.setItem(store,JSON.stringify(history));}catch{toast('No se pudo guardar en este navegador.');}}
let toastTimer;function toast(s){$('#toast').className='toast';$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').textContent='';$('#toast').className=''},3500);}
function dialog(title,html,actions){modalReturn=document.activeElement;$('#modal').innerHTML='<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><h2>'+title+'</h2>'+html+'<div class="actions">'+actions.map((a,i)=>'<button data-dialog="'+i+'" class="'+(a[2]?'confirm':'')+'">'+a[0]+'</button>').join('')+'</div></section></div>';$('#modal').querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>{const act=actions[Number(b.dataset.dialog)][1];closeDialog();act?.()});$('#modal button')?.focus();}
function closeDialog(){$('#modal').innerHTML='';modalReturn?.focus();}function go(t){tab=t;render();window.scrollTo(0,0)}
function clearWarning(){dialog('No repara la avería','<p>Borrar elimina códigos y datos de diagnóstico, y reinicia comprobaciones de emisiones (puede afectar a la ITV). Guarda antes la lectura. Si la avería sigue, el testigo puede volver. Los códigos permanentes no se borran así.</p><p>Solo con contacto puesto, motor apagado y coche parado. No lo hagas para ocultar una avería.</p><p class="fine">Aquí solo se borra el estado del coche ficticio.</p>',[['Cancelar'],['Borrar en la demo',()=>dialog('¿Borrar ahora?','<p>¿Has guardado los códigos y leído el aviso?</p>',[['No'],['Sí, borrar',()=>{if(!engineOff){dialog('Apaga el motor simulado','<p>La protección de seguridad bloquea el borrado: el motor ficticio sigue en marcha. Cambia al escenario de contacto puesto y motor apagado.</p>',[['Volver'],['Apagar simulador',()=>{engineOff=true;toast('Contacto puesto · RPM 0 · velocidad 0. Vuelve a pulsar borrar.');render()},true]]);return;}cleared=true;scanned=true;save('clear');render();toast('Borrado simulado confirmado. El código permanente sigue.');},true]]),true]]);}
const actions={connect:()=>{connected=true;toast('Simulador conectado. No se ha conectado ningún coche.');render()},disconnect:()=>{connected=false;scanned=false;cleared=false;engineOff=false;render();toast('Simulador desconectado')},scan:()=>{if(busy)return;busy=true;render();setTimeout(()=>{busy=false;scanned=true;save('scan');render();toast('Lectura ficticia guardada')},650)},clear:clearWarning,saveLive:()=>{save('live');toast('Cifras ficticias guardadas')},park:()=>{engineOff=true;toast('Escenario: contacto puesto, motor apagado y coche parado.');render()},deleteHistory:()=>dialog('¿Eliminar historial de demo?','<p>Se borrarán las lecturas ficticias de este navegador. No afecta a ningún coche.</p>',[['Cancelar'],['Eliminar',()=>{history=[];try{localStorage.removeItem(store)}catch{}render()},true]]),reset:()=>dialog('¿Reiniciar la demo?','<p>Desconecta el simulador y reinicia los códigos ficticios. El historial se conserva.</p>',[['Cancelar'],['Reiniciar',()=>{connected=false;scanned=false;cleared=false;engineOff=false;go('diagnostic')},true]]),about:()=>dialog('Car Diagnostic · demo v0.3','<p>Motor y emisiones por OBD2 genérico. Sin acceso ampliado a ABS o airbag. La app no determina si se puede conducir. Esta web es una prueba visual e interactiva, no una herramienta de diagnosis.</p><p>La versión Android v0.3 está disponible por separado. No se ha probado aún en coche o adaptador físico.</p><p>Esta demo muestra tres códigos de ejemplo; la preview Android incluye 12 explicaciones locales.</p><details class="links"><summary>Fuentes técnicas</summary><p><a href="https://www.elmelectronics.com/wp-content/uploads/2020/05/ELM327DSL.pdf" target="_blank" rel="noopener">Ficha ELM327: protocolo y borrado</a></p><p><a href="https://www.csselectronics.com/pages/obd2-pid-table-on-board-diagnostics-j1979" target="_blank" rel="noopener">PIDs y unidades OBD2</a></p><p><a href="https://www.obd-codes.com/p0171" target="_blank" rel="noopener">P0171</a> · <a href="https://www.obd-codes.com/p0301" target="_blank" rel="noopener">P0301</a> · <a href="https://www.obd-codes.com/p0420" target="_blank" rel="noopener">P0420</a></p><p class="fine">Consultadas el 15/11/2026. Explicaciones orientativas en español.</p></details>',[['Cerrar']])};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){go(b.dataset.tab);return}if(b.dataset.action){if(actions[b.dataset.action])actions[b.dataset.action]();else go(b.dataset.action)}if(b.dataset.code){const c=b.dataset.code,a=catalog[c];dialog(c+' · '+a[2],'<p>'+a[1]+'</p><p class="fine">Un código indica una condición detectada, no una pieza que cambiar ni un diagnóstico definitivo.</p>',[['Entendido']])}if(b.dataset.history!==undefined){const h=history[Number(b.dataset.history)];dialog('Lectura simulada','<p>'+new Date(h.date).toLocaleString('es-ES')+'</p>'+(h.kind==='live'?'<p>Solo cifras guardadas. Sin lectura de códigos.</p>':'<p>Confirmados: '+(h.cleared?'sin códigos':'P0171, P0301')+'<br>Pendientes: '+(h.cleared?'sin códigos':'P0171')+'<br>Permanentes: P0420</p>')+'<p>RPM: '+Number(h.rpm||0)+'<br>Velocidad: '+Number(h.speed||0)+' km/h<br>Refrigerante: '+Number(h.temp||84)+' °C<br>Tensión: '+Number(h.volts||12.6).toLocaleString('es-ES')+' V</p><p class="fine">Datos ficticios e históricos. No representan un vehículo actual.</p>',[['Cerrar']])}});
document.addEventListener('keydown',e=>{if(!$('#modal').firstChild)return;if(e.key==='Escape'){closeDialog();return}if(e.key==='Tab'){const f=[...$('#modal').querySelectorAll('button,a,summary,input,select,textarea')];const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

const enriched={"P0171": {"causes": "• Fuga de admisión o circuito PCV.\n• Medición MAF incorrecta.\n• Presión o suministro de combustible insuficiente.\n• Inyector, sensor de oxígeno o fuga de escape.", "checks": "En taller: contrastar correcciones de combustible, estanqueidad de admisión/escape y presión de alimentación; comprobar MAF e inyectores. La reparación depende de la prueba que falle. No cambiar una sonda solo por este código."}, "P0301": {"causes": "• Encendido: bujías, bobinas o conexiones, si el motor las equipa.\n• Inyección o alimentación de combustible.\n• Compresión o problema mecánico.\nLa combustión no permite señalar una pieza solo con el código.", "checks": "En taller: conservar los códigos y revisar encendido si existe, inyección y compresión. En P0301 centrar las pruebas en el cilindro 1 sin descartar causas comunes. Reparar solo tras confirmar el origen; una bobina no está diagnosticada por el código."}, "P0420": {"causes": "• Catalizador con rendimiento reducido.\n• Fugas de escape.\n• Sensores de oxígeno o su cableado.\n• Fallos de combustión o alimentación que afectan al escape.", "checks": "En taller: revisar primero fugas y fallos de combustión/alimentación; contrastar señales de las sondas y evaluar el catalizador. No condenar catalizador o sondas sin esas pruebas."}};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let profile={};try{profile=JSON.parse(localStorage.getItem('car-diagnostic-demo-profile')||'{}')}catch{}
function profileText(){const list=Object.entries(profile).filter(([k,v])=>v);return list.length?'Perfil de DEMO escrito por ti, no verificado<br>'+list.map(([k,v])=>escapeHtml(k)+': '+escapeHtml(v)).join('<br>'):'Sin perfil de demo';}
const priorRender=render;render=function(){priorRender();document.querySelectorAll('nav [data-tab]').forEach(b=>b.setAttribute('aria-current',(b.dataset.tab==='repairs')===(tab==='repairs')?'page':'false'));if(tab!=='repairs'){$('#main').insertAdjacentHTML('afterbegin','<div class="subnav">'+[['diagnostic','Códigos'],['live','En vivo'],['history','Historial'],['connection','Conexión']].map(([t,n])=>'<button data-tab="'+t+'">'+n+'</button>').join('')+'</div>');return;}$('#main').innerHTML=intro('ORIENTACIÓN · NO ES UNA DIAGNOSIS','Reparaciones.','Causas posibles y pruebas antes de cambiar piezas.')+'<section class="card"><h3>Tu vehículo · demo</h3><p>'+profileText()+'</p>'+button('Editar perfil de demo','profile',true)+'<p class="fine">Esta web NO cifra el perfil: se guarda en este navegador. Usa datos ficticios. No pongas matrícula ni bastidor. En Android el perfil local sí está cifrado.</p></section>'+(scanned?Object.keys(catalog).map(c=>'<section class="card"><div class="eyebrow">'+c+' · DEMO</div><h2>'+catalog[c][0]+'</h2><p>'+(c==='P0301'?'Atención prioritaria · no cambies piezas a ciegas.':'Guía genérica · causa y seguridad no confirmadas.')+'</p>'+button('Ver detalles','guide-'+c,true)+'</section>').join(''):'<section class="card"><h2>Primero, una lectura</h2><p>Activa la demo para ver las guías de tres códigos ficticios.</p>'+button('Probar demo · datos ficticios','demo')+'</section>');};
actions.demo=()=>{connected=true;scanned=true;go('diagnostic');toast('Lectura ficticia cargada. No es tu coche.')};
function fold(t,v){return '<details><summary>'+t+'</summary><p>'+escapeHtml(v).replace(/\n/g,'<br>')+'</p></details>';}
function guide(c){const urgent=c==='P0301'?'ATENCIÓN PRIORITARIA. Fallo de combustión: revisión pronta. Testigo parpadeando o tirones fuertes: detente con seguridad y pide asistencia. Este código no autoriza a seguir circulando.':'SEGURIDAD NO DETERMINADA POR EL CÓDIGO. Pide diagnosis. Humo, sobrecalentamiento, fuerte pérdida de potencia o testigo parpadeando: detente con seguridad y pide ayuda.';dialog(c+' · Guía orientativa','<p>'+catalog[c][1]+'</p>'+fold('Qué hacer ahora',urgent)+fold('Causas posibles',enriched[c].causes)+fold('Qué comprobar',enriched[c].checks)+fold('Coste · sin presupuesto verificado','No hay una estimación verificada para tu vehículo y taller. Un código puede tener causas y costes muy distintos. Pide diagnóstico, piezas, horas e impuestos desglosados.')+fold('Vehículo y alcance','Guía genérica: no se adapta al motor escrito. El perfil manual no identifica ni verifica el vehículo.')+fold('Campañas · no verificadas','No se han consultado campañas para tu vehículo. La ausencia de información aquí no demuestra que no existan. Consulta al fabricante con el bastidor o la DGT con identificación.')+'<details class="links"><summary>Fuentes · 15/11/2026</summary><p><a target="_blank" rel="noopener" href="https://www.obd-codes.com/'+c.toLowerCase()+'">Ficha '+c+' · OBD-Codes</a></p><p><a target="_blank" rel="noopener" href="https://sede.dgt.gob.es/es/vehiculos/informacion-de-vehiculos/llamadas-a-revision-de-un-vehiculo/">DGT · llamadas pendientes (consulta gratuita con identificación)</a></p></details>'+button('Calcular con mis cifras','calculator',true)+'<p class="links"><a href="https://www.oscaro.es" target="_blank" rel="noopener">Catálogo Oscaro</a> · <a href="https://www.autodoc.es" target="_blank" rel="noopener">Catálogo Autodoc</a></p><p class="fine">Se abren sitios externos. Elige vehículo y referencia. No se consulta un precio ni se confirma compatibilidad automáticamente.</p>',[['Cerrar']]);}
Object.keys(catalog).forEach(c=>actions['guide-'+c]=()=>guide(c));
actions.profile=()=>{const keys=['Marca','Modelo','Año','Motor / versión','Combustible'];dialog('Perfil de coche · DEMO','<p>Datos ficticios, guardados sin cifrar en este navegador. No se sincronizan con Android. Sin matrícula ni bastidor.</p><form id="profileForm">'+keys.map((k,i)=>'<label>'+k+'<input maxlength="70" name="p'+i+'" value="'+escapeHtml(profile[k]||'')+'"></label>').join('')+'</form>',[['Cancelar'],['Guardar',()=>{},true]]);const btn=$('#modal [data-dialog="1"]');btn.onclick=()=>{const form=$('#profileForm');let out={};keys.forEach((k,i)=>out[k]=form.elements['p'+i].value.trim());if(out['Año']&&!/^(19|20)\d{2}$/.test(out['Año'])){toast('Revisa el año');return;}try{localStorage.setItem('car-diagnostic-demo-profile',JSON.stringify(out));profile=out;closeDialog();render()}catch{toast('No se pudo guardar el perfil')}};};
actions.calculator=()=>{const fields=['Piezas mínimo €','Piezas máximo €','Trabajo mínimo horas','Trabajo máximo horas','Tarifa mínimo €/h','Tarifa máximo €/h','Fuente/fecha de piezas o estimación propia','Fuente de horas o estimación propia','Fuente de tarifa o estimación propia'];dialog('Calcular un escenario','<p>Manual, no precio consultado por la app. Usa importes con IVA incluido y añade la fuente o «estimación mía». No implica que haya que cambiar una pieza.</p><form id="costForm">'+fields.map((k,i)=>'<label>'+k+'<input name="v'+i+'" '+(i<6?'inputmode="decimal"':'maxlength="350"')+' required></label>').join('')+'</form>',[['Cancelar'],['Calcular',()=>{},true]]);$('#modal [data-dialog="1"]').onclick=()=>{const f=$('#costForm'),v=Array.from({length:9},(_,i)=>f.elements['v'+i].value.trim());if(v.slice(0,6).some(x=>!/^\d{1,6}([.,]\d{1,2})?$/.test(x))||v.slice(6).some(x=>!x)){toast('Completa todas las cifras y fuentes');return;}const nums=v.slice(0,6).map(x=>Math.round(Number(x.replace(',','.'))*100));if(nums[0]>nums[1]||nums[2]>nums[3]||nums[4]>nums[5]||nums[3]>100000){toast('Revisa los rangos mínimo/máximo');return;}const money=n=>(n/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',lo=Math.floor(nums[2]*nums[4]/100),hi=Math.ceil(nums[3]*nums[5]/100);dialog('Cálculo con tus cifras','<p><strong>ESCENARIO MANUAL · NO ES UN PRESUPUESTO</strong></p><p>Piezas: '+money(nums[0])+' - '+money(nums[1])+'<br>Fuente escrita por ti: '+escapeHtml(v[6])+'</p><p>Mano de obra: '+money(lo)+' - '+money(hi)+'<br>Horas: '+escapeHtml(v[2])+' - '+escapeHtml(v[3])+' · '+escapeHtml(v[7])+'<br>Tarifa €/h: '+escapeHtml(v[4])+' - '+escapeHtml(v[5])+' · '+escapeHtml(v[8])+'</p><h2>'+money(nums[0]+lo)+' - '+money(nums[1]+hi)+'</h2><p>Solo suma lo que has escrito. No añade diagnóstico, portes, consumibles ni otros trabajos. No verifica fuentes, compatibilidad ni que esa reparación sea necesaria.</p>',[['Cerrar']]);};};
// Replace the simple v0.1 code popover with the v0.3 guide, without changing APK files.
document.addEventListener('click',e=>{const b=e.target.closest('[data-code]');if(b){e.stopImmediatePropagation();guide(b.dataset.code)}},true);

setInterval(()=>{ticks++;updateLive()},1600);render();
</script></body></html>
